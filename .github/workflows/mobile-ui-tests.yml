name: Mobile UI tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Responsive layout and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Build static website for browser tests
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Run responsive UI tests
        run: npx playwright test
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
